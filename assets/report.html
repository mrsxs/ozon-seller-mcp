<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
<title>@@TITLE@@</title>
<style>
:root{--blue:#2563eb;--ink:#18243b;--muted:#63728a;--line:#e3e9f2;--bg:#f3f6fb;--card:#fff;--soft:#edf3ff;--radius:16px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}header{background:#132440;color:white;padding:32px max(24px,calc((100vw - 1240px)/2)) 62px}header .brand{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.1em;color:#c3d5f4}.logo{display:grid;place-items:center;background:#3b79f5;color:white;width:35px;height:35px;border-radius:11px;font-size:22px;font-weight:700}h1{font-size:32px;line-height:1.25;margin:25px 0 10px;letter-spacing:-.02em}.subtitle{color:#b8cae6;margin:0}.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;font-size:12px;color:#d8e5f9}.meta span{padding:5px 11px;background:#ffffff12;border:1px solid #ffffff20;border-radius:7px}main{max-width:1288px;margin:-32px auto 48px;padding:0 24px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 4px 14px #12335706}.metric-label{color:var(--muted);font-size:13px}.metric-value{font-size:34px;line-height:1.35;font-weight:700;margin:8px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}.metric-value small{font-size:13px;color:var(--muted);margin-left:7px;font-weight:400}.metric p{color:var(--muted);font-size:12px;margin:0}nav{display:flex;gap:7px;flex-wrap:wrap;margin:24px 0}nav a{text-decoration:none;color:var(--muted);padding:7px 13px;border-radius:7px;background:white;border:1px solid var(--line)}nav a:hover,nav a:focus{color:var(--blue);border-color:#8cb3ff}section{scroll-margin-top:20px}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);margin:20px 0;overflow:hidden}.panel-head{padding:23px 24px 17px;display:flex;justify-content:space-between;align-items:start;gap:20px}h2{font-size:18px;margin:0 0 5px}.panel-head p{margin:0;font-size:12px;color:var(--muted);max-width:850px}.export{background:var(--soft);color:#2354aa;border:1px solid #d8e5ff;border-radius:8px;padding:8px 13px;white-space:nowrap;cursor:pointer;font:inherit;font-size:12px}.export:hover{background:#dce8ff}.tools{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:0 24px 18px;color:var(--muted);font-size:12px}.tools label{display:flex;align-items:center;gap:12px}.tools input{width:290px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcff;font:inherit;color:var(--ink)}:focus-visible{outline:3px solid #93b5fc;outline-offset:2px}.table-wrap{overflow-x:auto;max-height:620px}table{width:100%;border-collapse:collapse;font-size:13px}thead{position:sticky;top:0;z-index:1;background:#f7f9fd}th{font-weight:600;color:#5c6b81;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th button{width:100%;padding:13px 18px;border:0;background:none;text-align:inherit;color:inherit;font:inherit;cursor:pointer}th button span{margin-left:10px;color:#a7b4c8}td{padding:14px 18px;border-bottom:1px solid #edf0f6;max-width:350px;overflow-wrap:anywhere;vertical-align:top}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fcfdff}tbody tr:hover{background:#f2f6ff}.number,.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.status{white-space:nowrap}.badge{display:inline-block;padding:2px 9px;background:#eff4ff;color:#305caa;border:1px solid #dce7fc;border-radius:6px;font-size:12px}.missing{color:#8e9bb0}.empty{text-align:center;color:var(--muted);padding:38px}.notice{border:1px solid #dce5f5;border-left:3px solid #7099df;border-radius:10px;padding:16px 20px;background:#eef3fc;color:#526581;font-size:12px;margin:22px 0}.notice strong{color:#314c75}.notice ul{margin:8px 0 0;padding-left:19px}footer{display:flex;justify-content:space-between;color:#8090a7;font-size:11px;margin-top:26px;gap:12px}.nojs{background:#fff3d6;padding:10px;border-radius:8px}.nojs span{color:#6c5119}@media(max-width:600px){header{padding:24px 16px 54px}h1{font-size:26px}main{padding:0 12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:16px}.metric-value{font-size:27px}.panel-head{padding:18px 16px;flex-direction:column;gap:12px}.tools{padding:0 16px 14px;flex-wrap:wrap}.tools label{width:100%}.tools input{width:100%;min-width:0}td,th button{padding:12px}footer{flex-direction:column}nav{gap:6px}}@media print{body{background:white}header{background:white;color:#132440;padding:10px 0 30px}.subtitle,.meta{color:#526581}.meta span{border-color:#ddd}main{margin:0;padding:0;max-width:none}.metric{box-shadow:none}nav,.tools,.export,footer{display:none}.panel{break-inside:auto}.table-wrap{max-height:none;overflow:visible}thead{position:static;display:table-header-group}tr{break-inside:avoid}.panel-head{padding:14px}th button{padding:8px}td{padding:8px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<header><div class="brand"><span class="logo">O</span><span>OZON / SELLER INSIGHTS</span></div><h1>@@TITLE@@</h1><p class="subtitle">@@SUBTITLE@@</p><div class="meta"><span>@@SCOPE@@</span><span>查询时间：@@TIME@@</span></div></header>
<main><div class="metrics">@@METRICS@@</div><nav aria-label="报告章节">@@NAV@@</nav><noscript><p class="nojs"><span>当前未启用 JavaScript，所有原始表格仍可阅读；搜索、排序和导出需要启用 JavaScript。</span></p></noscript>@@SECTIONS@@@@NOTICES@@<footer><span>Ozon Seller · 私有本地报告</span><span>此页面离线阅读，不会自动查询或修改店铺数据</span></footer></main>
<script type="application/json" id="report-data">@@PAYLOAD@@</script>
<script>
'use strict';
const report=JSON.parse(document.getElementById('report-data').textContent);
const asText=v=>v===null||v===undefined?'—':typeof v==='boolean'?(v?'是':'否'):typeof v==='object'?JSON.stringify(v):String(v);
const numeric=v=>v===null||v===undefined||v===''?NaN:Number(v);
function display(v,c){if(v===null||v===undefined)return '—';if(['number','money'].includes(c.type)&&Number.isFinite(numeric(v))){return new Intl.NumberFormat('zh-CN',{maximumFractionDigits:c.type==='money'?2:6,minimumFractionDigits:c.type==='money'?2:0}).format(Number(v))+(c.type==='money'&&c.currency?' '+c.currency:'')}return asText(v)}
function csvCell(v){let s=v===null||v===undefined?'':asText(v);if(typeof v!=='number'&&/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
document.querySelectorAll('[data-section]').forEach(panel=>{const section=report.sections[Number(panel.dataset.section)],columns=section.columns;let selected=(section.rows||[]).slice(),sortIndex=-1,ascending=true;const tbody=panel.querySelector('tbody'),input=panel.querySelector('input'),count=panel.querySelector('.row-count');
function render(){const q=input.value.trim().toLocaleLowerCase();selected=(section.rows||[]).filter(row=>columns.some(c=>asText(row[c.key]).toLocaleLowerCase().includes(q)));if(sortIndex>=0){const c=columns[sortIndex],numericColumn=['number','money'].includes(c.type);selected.sort((a,b)=>{const av=a[c.key],bv=b[c.key];const am=av===null||av===undefined||av==='',bm=bv===null||bv===undefined||bv==='';if(am!==bm)return am?1:-1;const n=numericColumn&&Number.isFinite(numeric(av))&&Number.isFinite(numeric(bv))?numeric(av)-numeric(bv):asText(av).localeCompare(asText(bv),'zh-CN',{numeric:true});return ascending?n:-n})}tbody.replaceChildren();if(!selected.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=columns.length;td.className='empty';td.textContent='当前筛选范围内暂无记录';tr.append(td);tbody.append(tr)}else{const fragment=document.createDocumentFragment();selected.forEach(row=>{const tr=document.createElement('tr');columns.forEach(c=>{const td=document.createElement('td');td.className=c.type||'text';if(c.type==='status'&&row[c.key]!==null&&row[c.key]!==undefined){const badge=document.createElement('span');badge.className='badge';badge.textContent=display(row[c.key],c);td.append(badge)}else td.textContent=display(row[c.key],c);tr.append(td)});fragment.append(tr)});tbody.append(fragment)}count.textContent=selected.length.toLocaleString()+' / '+(section.rows||[]).length.toLocaleString()+' 条记录'}
input.addEventListener('input',render);panel.querySelectorAll('th button').forEach(button=>button.addEventListener('click',()=>{const index=Number(button.dataset.column);ascending=sortIndex===index?!ascending:true;sortIndex=index;panel.querySelectorAll('th').forEach(th=>th.setAttribute('aria-sort','none'));button.parentElement.setAttribute('aria-sort',ascending?'ascending':'descending');render()}));panel.querySelector('.export').addEventListener('click',()=>{const lines=[columns.map(c=>csvCell(c.label)).join(','),...selected.map(row=>columns.map(c=>csvCell(row[c.key])).join(','))];const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=section.title.replace(/[\\/:*?"<>|]/g,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})});
</script></body></html>
